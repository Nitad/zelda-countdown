<head>

<title>Ocarina of Time Remake - Countdown</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 90'%3E%3Crect width='100' height='90' rx='14' fill='%230b1a12'/%3E%3Cg fill='%23e6c35c'%3E%3Cpolygon points='50,8 69,41 31,41'/%3E%3Cpolygon points='31,45 50,78 12,78'/%3E%3Cpolygon points='69,45 88,78 50,78'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#0b1a12">
<meta name="description" content="Nedräkning till The Legend of Zelda: Ocarina of Time Remake - 5 november 2026, 00:00 CET">
<meta property="og:type" content="website">
<meta property="og:title" content="Ocarina of Time Remake - Countdown">
<meta property="og:description" content="Släpps 5 november 2026, 00:00 CET. Hur lång tid är det kvar?">

<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;1,400&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root {
    --forest:#0a1a12; --moss:#1d5a37; --gold:#e6c35c; --gold-dim:#a8841f;
    --parchment:#efe6c8; --night:#0d1b3a; --leaf:#7fd37f;
    --display:"Marcellus", "Trajan Pro", Georgia, serif;
    --text:"Alegreya", Georgia, serif;
    --t:0; /* 0 = dawn, 1 = midnight; set by script */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    position: relative; overflow: hidden; background: var(--forest); color: var(--parchment);
    font-family: var(--text); font-size: 1.125rem; line-height: 1.5;
  }

  /* Sky: dawn and night layers cross-fade; the sun becomes the moon at midnight */
  .sky, .night { position: fixed; inset: 0; }
  .sky { background: linear-gradient(180deg, #2f7a58 0%, #4f8f63 34%, #9aa865 58%, #c9b66a 70%, #0a1a12 100%); }
  .night { background: linear-gradient(180deg, #060d22 0%, #0d1b3a 45%, #14402e 80%, #0a1a12 100%);
           opacity: var(--night-o, 0); }
  .stars { position: fixed; inset: 0 0 40% 0; opacity: var(--night-o, 0);
    background:
      radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 27% 8%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 44% 22%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 63% 12%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 78% 26%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 9%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 35% 32%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 70% 36%, #fff 50%, transparent 51%); }
  .orb { position: fixed; cursor: grab; touch-action: none; user-select: none; width: clamp(54px, 9vw, 96px); aspect-ratio: 1; border-radius: 50%;
         left: calc(8% + 84% * var(--t) - clamp(27px, 4.5vw, 48px));
         top: calc(46vh - 38vh * sin(var(--t) * 3.14159) - clamp(27px, 4.5vw, 48px)); }
  .sun { background: radial-gradient(circle at 40% 40%, #fff6c2, #f1c64a 60%, #e39b2a);
         box-shadow: 0 0 60px 20px rgba(255,214,102,.45); opacity: var(--sun-o, 1); }
  .moon { background: radial-gradient(circle at 38% 38%, #ffffff, #d7def0 65%, #aab6d4);
          box-shadow: 0 0 50px 12px rgba(190,205,255,.35); opacity: var(--night-o, 0); }
  .hills { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 34vh; display: block; }

  /* Leaf frame at both edges */
  .leaf { position: fixed; z-index: 1; transform-origin: 50% 0%;
          animation: sway var(--dur) ease-in-out var(--delay) infinite alternate; }
  .leaf svg { display: block; transform-origin: 50% 0%; }
  .leaf.brushed svg { animation: flutter .9s ease-out; }
  @keyframes flutter { 25% { transform: rotate(20deg); } 55% { transform: rotate(-13deg); } 80% { transform: rotate(6deg); } }
  @keyframes sway { from { transform: rotate(calc(var(--rot) - 6deg)); } to { transform: rotate(calc(var(--rot) + 6deg)); } }

  main { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column;
         align-items: center; justify-content: center; text-align: center; padding: 16px 16px 6vh; pointer-events: none; }
  main > * { pointer-events: auto; }

  .oc-wrap { margin-bottom: .9rem; animation: bob 6s ease-in-out infinite; }
  .ocarina { width: clamp(120px, 18vw, 170px); display: block; cursor: pointer; rotate: var(--lean, 0deg);
             transition: rotate .25s ease-out; filter: drop-shadow(0 8px 12px rgba(0,0,0,.45)); border-radius: 40%; }
  .ocarina:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; }
  .ocarina.hop { animation: hop .4s ease-out; }
  .ocarina.hop .crest { animation: flash .5s ease-out; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-2deg); } }
  @keyframes hop { 40% { translate: 0 -16px; scale: 1.06; } }
  @keyframes flash { 30% { filter: brightness(1.8) drop-shadow(0 0 8px #ffe28a); } }

  .series { margin: 0; font-style: italic; font-size: 1.2rem; color: var(--gold); }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; color: var(--parchment);
       font-size: clamp(2.6rem, 9vw, 5.6rem); line-height: 1.02; letter-spacing: .01em;
       text-shadow: 0 2px 18px rgba(0,0,0,.55); }
  .seal { display: inline-block; margin-top: .7rem; padding: .1rem .9rem .15rem; border: 1px solid var(--gold);
          border-radius: 999px; color: var(--gold); font-family: var(--display); font-size: 1.05rem; background: rgba(10,26,18,.55); }

  .timer { display: flex; align-items: flex-start; justify-content: center; gap: clamp(14px, 4vw, 44px);
           margin: clamp(1.2rem, 4vh, 2.4rem) 0 .6rem; }
  .unit { min-width: clamp(72px, 14vw, 140px); }
  .unit + .unit { padding-left: clamp(14px, 4vw, 44px); border-left: 1px solid rgba(239,230,200,.55); margin-left: calc(-1 * clamp(14px, 4vw, 44px) / 2); }
  .num { display: block; font-family: var(--text); font-weight: 500; font-size: clamp(2.8rem, 10.5vw, 6rem); line-height: 1.05;
         color: #fff7d6; font-variant-numeric: lining-nums tabular-nums; text-shadow: 0 2px 16px rgba(0,0,0,.5); }
  .word { font-style: italic; color: var(--parchment); text-shadow: 0 1px 8px rgba(0,0,0,.85), 0 0 3px rgba(0,0,0,.6); }
  .date { margin: 0; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  #done { display: none; font-family: var(--display); font-size: clamp(2.4rem, 8vw, 4.6rem); color: var(--gold); margin: 1.5rem 0 0; }

  @media (max-width: 600px) {
    .leaf { opacity: .4; zoom: .6; }
    .unit { min-width: 0; }
    .unit + .unit { margin-left: 0; padding-left: 12px; }
    .timer { gap: 12px; }
    .word { font-size: .95rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="sky"></div><div class="night"></div><div class="stars"></div>
<div class="orb sun"></div><div class="orb moon"></div>
<svg class="hills" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 150 C180 70 360 120 560 140 C760 160 900 60 1100 90 C1260 114 1360 150 1440 120 L1440 300 L0 300Z" fill="#12402a" opacity=".85"/>
  <path d="M0 210 C200 150 420 200 640 190 C860 180 1060 140 1240 170 C1340 186 1400 200 1440 190 L1440 300 L0 300Z" fill="#0a2616"/>
</svg>
<div id="leaves" aria-hidden="true"></div>

<main>
  <div class="oc-wrap"><svg class="ocarina" id="ocarina" viewBox="0 0 200 130" role="button" tabindex="0" aria-label="Spela en ton" focusable="true">
    <title>Spela en ton</title>
    <defs>
      <linearGradient id="oc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cc2ff"/><stop offset="1" stop-color="#2c5fb8"/></linearGradient>
    </defs>
    <path d="M22 78 C20 42 62 22 108 32 L146 44 C176 52 190 82 168 100 C140 122 56 124 34 104 C26 97 22 88 22 78Z" fill="url(#oc)" stroke="#173a73" stroke-width="3"/>
    <path d="M142 46 L168 22 L184 34 L160 60Z" fill="url(#oc)" stroke="#173a73" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#12295a"><circle cx="100" cy="64" r="6"/><circle cx="120" cy="66" r="6"/><circle cx="140" cy="74" r="6"/>
       <circle cx="108" cy="90" r="7"/><circle cx="134" cy="92" r="7"/></g>
    <g class="crest" fill="#e6c35c" stroke="#a8841f" stroke-width=".8" stroke-linejoin="round">
      <polygon points="60,54 70,71 50,71"/><polygon points="49,74 59,91 39,91"/><polygon points="71,74 81,91 61,91"/></g>
  </svg></div>

  <p class="series">The Legend of Zelda</p>
  <h1>Ocarina of Time</h1>
  <span class="seal">Remake</span>

  <div class="timer" id="timer" role="timer" aria-live="off">
    <div class="unit" id="u-d"><span class="num" id="d">0</span><span class="word">dagar</span></div>
    <div class="unit"><span class="num" id="h">00</span><span class="word">timmar</span></div>
    <div class="unit"><span class="num" id="m">00</span><span class="word">minuter</span></div>
    <div class="unit"><span class="num" id="s">00</span><span class="word">sekunder</span></div>
  </div>
  <p class="date">Släpps 5 november 2026, 00:00 CET</p>
  <p id="done">Det är dags.</p>
</main>

<script>
  // Leaves framing both sides
  const leafSvg = (c1, c2) => `<svg viewBox="0 0 40 80" width="100%" height="100%">
    <path d="M20 2 C42 22 42 58 20 78 C-2 58 -2 22 20 2Z" fill="${c1}"/>
    <path d="M20 6 L20 74" stroke="${c2}" stroke-width="1.5" fill="none"/></svg>`;
  const greens = [["#2f7d3f", "#a9e3a0"], ["#3f9a4f", "#bff0b4"], ["#1f5e33", "#86c987"], ["#58b45f", "#d6f7cc"]];
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const box = document.getElementById("leaves");
  for (const side of ["left", "right"]) {
    for (let i = 0; i < 16; i++) {
      const el = document.createElement("div");
      const w = 26 + rnd() * 34, [c1, c2] = greens[Math.floor(rnd() * greens.length)];
      el.className = "leaf";
      el.style.cssText = `${side}:${-w * 0.35 + rnd() * 26}px; top:${(i / 16) * 100 - 4 + rnd() * 4}vh;
        width:${w}px; height:${w * 2}px; --rot:${(side === "left" ? -1 : 1) * (35 + rnd() * 50)}deg;
        --dur:${3 + rnd() * 3}s; --delay:${-rnd() * 4}s;`;
      el.innerHTML = leafSvg(c1, c2);
      const brush = () => el.classList.add("brushed");
      el.addEventListener("pointerenter", brush);
      el.addEventListener("pointerdown", brush);
      el.addEventListener("animationend", e => { if (e.animationName === "flutter") el.classList.remove("brushed"); });
      box.appendChild(el);
    }
  }

  // Countdown. The sun crosses the sky during the last 24 hours and turns into the moon at release.
  const target = new Date("2026-11-05T00:00:00+01:00");
  const pad = n => String(n).padStart(2, "0");
  const root = document.documentElement.style;
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const smooth = (a, b, x) => { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let realT = 0, shownT = null, override = null;

  function tick() {
    const diff = Math.floor((target - Date.now()) / 1000);
    realT = clamp01(1 - diff / 86400);
    if (diff <= 0) {
      document.getElementById("timer").style.display = "none";
      document.getElementById("done").style.display = "block";
      return clearInterval(id);
    }
    const days = Math.floor(diff / 86400);
    document.getElementById("u-d").style.display = days > 0 ? "" : "none";
    document.getElementById("d").textContent = days;
    document.getElementById("h").textContent = pad(Math.floor(diff % 86400 / 3600));
    document.getElementById("m").textContent = pad(Math.floor(diff % 3600 / 60));
    document.getElementById("s").textContent = pad(diff % 60);
  }
  const id = setInterval(tick, 1000);
  tick();

  // Sky follows the real time, or the dragged position, with easing
  function paint() {
    const goal = override ?? realT;
    shownT = shownT === null || reduced ? goal : shownT + (goal - shownT) * 0.12;
    root.setProperty("--t", shownT.toFixed(4));
    root.setProperty("--night-o", smooth(0.55, 0.95, shownT).toFixed(3));
    root.setProperty("--sun-o", (1 - smooth(0.8, 0.97, shownT)).toFixed(3));
    requestAnimationFrame(paint);
  }
  paint();

  // Drag the sun or moon to preview the day and night
  document.querySelectorAll(".orb").forEach(orb => {
    orb.addEventListener("pointerdown", e => { orb.setPointerCapture(e.pointerId); orb.dragging = true; e.preventDefault(); });
    orb.addEventListener("pointermove", e => {
      if (orb.dragging) override = clamp01((e.clientX / innerWidth - 0.08) / 0.84);
    });
    const release = () => { orb.dragging = false; override = null; orb.style.cursor = ""; };
    orb.addEventListener("pointerup", release);
    orb.addEventListener("pointercancel", release);
  });

  // Ocarina: leans toward the pointer, plays a note on click. Six clicks in a row play the Song of Time.
  const oc = document.getElementById("ocarina");
  addEventListener("pointermove", e => {
    const r = oc.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width / 2)) / innerWidth;
    oc.style.setProperty("--lean", Math.max(-10, Math.min(10, dx * 28)).toFixed(1) + "deg");
  });
  // Song of Time: C-right, A, C-down, C-right, A, C-down = A4, D4, F4, A4, D4, F4
  const song = [440, 293.66, 349.23, 440, 293.66, 349.23];
  let step = 0, lastClick = 0, audio = null;
  function playNote(freq) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const now = audio.currentTime, out = audio.createGain();
      out.gain.setValueAtTime(0.0001, now);
      out.gain.exponentialRampToValueAtTime(0.35, now + 0.04);
      out.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
      out.connect(audio.destination);
      const lfo = audio.createOscillator(), depth = audio.createGain();
      lfo.frequency.value = 5.5; depth.gain.value = 3;
      lfo.connect(depth);
      [["sine", 1, 1], ["triangle", 2, 0.12]].forEach(([type, mult, vol]) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = type; o.frequency.value = freq * mult; g.gain.value = vol;
        depth.connect(o.frequency); o.connect(g); g.connect(out);
        o.start(now); o.stop(now + 1);
      });
      lfo.start(now); lfo.stop(now + 1);
    } catch (_) { /* audio unavailable: the hop still plays */ }
  }
  function play() {
    const now = Date.now();
    step = now - lastClick > 2500 ? 0 : step;
    lastClick = now;
    playNote(song[step]);
    oc.classList.remove("hop"); void oc.getBoundingClientRect(); oc.classList.add("hop");
    step += 1;
    if (step === song.length) {
      step = 0;
      override = 1;                       // the Song of Time: skip ahead to midnight
      setTimeout(() => { override = null; }, 4500);
    }
  }
  oc.addEventListener("click", play);
  oc.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(); } });
</script>
</body>
</html>
