<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocarina of Time - Countdown</title>
<style>
  :root { --bg:#0b1a12; --fg:#e8f3d6; --gold:#e6c35c; --green:#4caf50; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
    background: radial-gradient(ellipse at top, #16422a 0%, var(--bg) 70%);
    color: var(--fg); font-family: Georgia, "Times New Roman", serif; padding: 16px;
  }
  h1 { font-size: clamp(1.6rem, 5vw, 3rem); color: var(--gold); margin: 0 0 .25em; letter-spacing: .04em; }
  p { margin: 0 0 2rem; opacity: .8; }
  .timer { display: flex; gap: clamp(8px, 3vw, 28px); justify-content: center; }
  .box { min-width: clamp(64px, 18vw, 130px); padding: 18px 8px; border: 2px solid var(--gold);
         border-radius: 10px; background: rgba(0,0,0,.35); }
  .num { display: block; font-size: clamp(2rem, 9vw, 4.5rem); font-variant-numeric: tabular-nums; color: var(--green); }
  .label { font-size: .85rem; text-transform: uppercase; letter-spacing: .15em; }
  #done { display: none; font-size: clamp(1.8rem, 6vw, 3.5rem); color: var(--gold); }
</style>
</head>
<body>
<main>
  <h1>The Legend of Zelda: Ocarina of Time</h1>
  <p>Släpps 5 november 2026, 00:00 CET</p>
  <div class="timer" id="timer">
    <div class="box"><span class="num" id="d">0</span><span class="label">Dagar</span></div>
    <div class="box"><span class="num" id="h">00</span><span class="label">Timmar</span></div>
    <div class="box"><span class="num" id="m">00</span><span class="label">Minuter</span></div>
    <div class="box"><span class="num" id="s">00</span><span class="label">Sekunder</span></div>
  </div>
  <div id="done">Det är dags! 🎶</div>
</main>
<script>
  const target = new Date("2026-11-05T00:00:00+01:00");
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    let diff = Math.floor((target - Date.now()) / 1000);
    if (diff <= 0) {
      document.getElementById("timer").style.display = "none";
      document.getElementById("done").style.display = "block";
      return clearInterval(id);
    }
    document.getElementById("d").textContent = Math.floor(diff / 86400);
    document.getElementById("h").textContent = pad(Math.floor(diff % 86400 / 3600));
    document.getElementById("m").textContent = pad(Math.floor(diff % 3600 / 60));
    document.getElementById("s").textContent = pad(diff % 60);
  }
  const id = setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
